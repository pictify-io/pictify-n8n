name: Publish to npm (provenance)

# Publishes the package to npm with an npm provenance statement, which n8n
# requires for verified community nodes (locally-published nodes are rejected
# for verification since 2026-05-01). Triggered by pushing a vX.Y.Z tag, or
# manually via the Actions tab.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC attestation)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        # --ignore-scripts skips native builds (e.g. isolated-vm pulled in by
        # n8n-workflow); only its TypeScript types are needed to compile.
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
